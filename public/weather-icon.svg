<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Sun -->
  <g>
    <circle cx="15" cy="14" r="7" fill="#FFC107"/>
    <g stroke="#FFC107" stroke-width="2" stroke-linecap="round">
      <line x1="15" y1="2" x2="15" y2="5"/>
      <line x1="15" y1="23" x2="15" y2="26"/>
      <line x1="3" y1="14" x2="6" y2="14"/>
      <line x1="24" y1="14" x2="27" y2="14"/>
      <line x1="6.5" y1="5.5" x2="8.5" y2="7.5"/>
      <line x1="21.5" y1="5.5" x2="19.5" y2="7.5"/>
      <line x1="6.5" y1="22.5" x2="8.5" y2="20.5"/>
      <line x1="21.5" y1="22.5" x2="19.5" y2="20.5"/>
    </g>
  </g>

  <!-- Cloud -->
  <g fill="#7DD3EE" stroke="#3B7A99" stroke-width="1.2" stroke-linejoin="round">
    <path d="M14 34
             a8 8 0 0 1 15.5 -3
             a7 7 0 0 1 6.5 -2
             a8 8 0 0 1 8 8
             a7 7 0 0 1 -2 13.5
             h-25
             a8 8 0 0 1 -3 -16.5
             z"/>
  </g>

  <!-- Lightning bolt -->
  <polygon points="33,30 26,42 31,42 27,52 38,38 32,38 36,30"
           fill="#FFC107" stroke="#B8860B" stroke-width="1"/>

  <!-- Raindrops -->
  <g fill="#4FC3F7">
    <path d="M18 50 q3 5 0 8 q-3 -3 0 -8 z"/>
    <path d="M26 52 q3 5 0 8 q-3 -3 0 -8 z"/>
  </g>

  <!-- Thermometer -->
  <g>
    <rect x="48" y="8" width="7" height="34" rx="3.5" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5"/>
    <circle cx="51.5" cy="46" r="7" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.5"/>
    <rect x="49.7" y="24" width="3.6" height="21" rx="1.8" fill="#EF5350"/>
    <circle cx="51.5" cy="46" r="4.5" fill="#EF5350"/>
    <g stroke="#B0BEC5" stroke-width="1" stroke-linecap="round">
      <line x1="57" y1="14" x2="59.5" y2="14"/>
      <line x1="57" y1="20" x2="59.5" y2="20"/>
      <line x1="57" y1="26" x2="59.5" y2="26"/>
    </g>
  </g>
</svg>
